<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dersingham Assessment Portal</title>
    <meta name="description" content="Interactive primary school pupil assessments and staff dashboard trackers." />
    <meta property="og:title" content="Dersingham Assessment Portal" />
    <meta property="og:description" content="Interactive primary school pupil assessments and staff dashboard trackers." />
  </head>
  <body>
    <div id="root">
      <div style="font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: #f8fafc; color: #0f172a; text-align: center; padding: 24px; box-sizing: border-box;">
        <div style="max-width: 440px; width: 100%; padding: 32px 24px; border: 3px solid #0f172a; border-radius: 16px; background: #ffffff; box-shadow: 4px 4px 0px #0f172a;">

    </div>
    <noscript>
      <div style="font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: #f8fafc; color: #0f172a; text-align: center; padding: 24px;">
        <div style="max-width: 440px; padding: 28px; border: 3px solid #0f172a; border-radius: 16px; background: #ffffff; box-shadow: 4px 4px 0px #0f172a;">
          <h2 style="margin: 0 0 10px 0; font-size: 18px; font-weight: 800;">JavaScript Required</h2>
          <p style="margin: 0; font-size: 14px; color: #475569;">Please enable JavaScript in your browser to run the Dersingham Assessment Portal.</p>
        </div>
      </div>
